# ---------------------------------------------------------------
# Site Settings
# ---------------------------------------------------------------

title: Rebenko Georgy
subtitle: Hard Surface and Prop Modeler & Tile texturing
description: >-
  Remote 3D artist.
  Passionate Blender modeller and Substance Disigner texturing.

url: "https://debugdancerreborn.github.io"          # Change to your final URL once live
baseurl: ""                                    # Leave empty for root domain

repository: debugdancerreborn/debugdancerreborn.github.io   # Important for GitHub Pages

# ---------------------------------------------------------------
# Theme Settings (Remote Theme - Best for GitHub Pages)
# ---------------------------------------------------------------

remote_theme: "mmistakes/minimal-mistakes@4.28.0"   # You can update the version later if needed
minimal_mistakes_skin: "neon"                       # Options: default, air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise

# ---------------------------------------------------------------
# Build Settings
# ---------------------------------------------------------------

markdown: kramdown
plugins:
  - jekyll-include-cache   # Required for Minimal Mistakes on GitHub Pages

# Include the _pages directory so Jekyll processes those files
include:
  - _pages  

# ---------------------------------------------------------------
# Author / Profile Information (appears in sidebar and about)
# ---------------------------------------------------------------

author:
  name: Rebenko Georgy
  avatar: "/assets/images/bio-photo.jpg"     # Upload your photo to /assets/images/
  bio: >-
    3D artist with over 5 years of experience.
    Long-time Blender enthusiast, .
  location: "Gyumri, Armenia"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/"   # Update with your exact LinkedIn URL
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/DebugdancerReborn"
    - label: "Telegram"
      icon: "fab fa-fw fa-telegram"
      url: "https://t.me/Debugdancer"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:gerrebenko@gmail.com"               # Use a professional or alias email
    - label: "Whatsapp"
      icon: "fab fa-fw fa-whatsapp"
      url: "https://wa.me/79036826563"

# ---------------------------------------------------------------
# Other Useful Settings
# ---------------------------------------------------------------

search: true                    # Enables site search
paginate: 5                     # Posts per page (if you add a blog later)
paginate_path: "/page/:num/"

# Header / Navigation will be defined in _data/navigation.yml (create this file next)

# Optional: Footer text
footer_text: "&copy; Rebenko Georgy. All rights reserved. "
