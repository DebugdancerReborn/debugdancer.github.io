<script>
  if (!window.scriptsInitialized) {
    window.scriptsInitialized = true;

    document.addEventListener('DOMContentLoaded', function() {
      // ========== ВЫПАДАЮЩИЕ СПИСКИ ==========
      const dropdowns = document.querySelectorAll('.masthead__menu-item.dropdown');
      console.log('Найдено dropdown элементов:', dropdowns.length);

      function closeAllDropdowns(exceptMenu = null) {
        dropdowns.forEach(dropdown => {
          const menu = dropdown.querySelector('.dropdown-menu');
          if (menu && menu !== exceptMenu) {
            menu.classList.remove('show');
          }
        });
      }

      function toggleDropdown(menu) {
        menu.classList.toggle('show');
      }

      dropdowns.forEach(dropdown => {
        const toggleLink = dropdown.querySelector('.dropdown-toggle');
        const dropdownMenu = dropdown.querySelector('.dropdown-menu');

        if (!toggleLink || !dropdownMenu) return;

        toggleLink.addEventListener('click', function(e) {
          e.preventDefault();
          e.stopPropagation();
          const isVisible = dropdownMenu.classList.contains('show');
          closeAllDropdowns(dropdownMenu);
          if (!isVisible) {
            toggleDropdown(dropdownMenu);
          }
        });

        dropdownMenu.addEventListener('click', function(e) {
          e.stopPropagation();
        });
      });

      document.addEventListener('click', function() {
        closeAllDropdowns();
      });

      // ========== ГАЛЕРЕЯ С МОДАЛЬНЫМИ ОКНАМИ ==========
      const cards = document.querySelectorAll('.gallery-card-list .card-item');
      if (cards.length) {
        // Создаём модальное окно один раз
        const modalOverlay = document.createElement('div');
        modalOverlay.className = 'modal-overlay';
        const modalContentDiv = document.createElement('div');
        modalContentDiv.className = 'modal-content';
        const closeBtn = document.createElement('span');
        closeBtn.innerHTML = '&times;';
        closeBtn.className = 'close-modal';
        modalContentDiv.appendChild(closeBtn);
        modalOverlay.appendChild(modalContentDiv);
        document.body.appendChild(modalOverlay);

        function openModal(contentElements) {
          // Очищаем всё, кроме кнопки закрытия
          while (modalContentDiv.children.length > 1) {
            modalContentDiv.removeChild(modalContentDiv.lastChild);
          }
          // Добавляем склонированное содержимое
          contentElements.forEach(el => {
            modalContentDiv.appendChild(el);
          });
          modalOverlay.classList.add('active');
          document.body.classList.add('modal-open');
        }

        function closeModal() {
          modalOverlay.classList.remove('active');
          document.body.classList.remove('modal-open');
        }

        closeBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', function(e) {
          if (e.target === modalOverlay) closeModal();
        });

        cards.forEach(card => {
          card.addEventListener('click', (e) => {
            // Клонируем заголовок
            const titleEl = card.querySelector('.card-title');
            const titleClone = titleEl ? document.createElement('h2') : null;
            if (titleClone) {
              titleClone.textContent = titleEl.textContent;
              titleClone.style.marginBottom = '1rem';
            }

            // Клонируем группу изображений
            const imageGroup = card.querySelector('.image-group');
            const imageGroupL = card.querySelector('.image-group-large');
            const imageGroupClone = imageGroup ? imageGroup.cloneNode(true) : null;
            const imageGroupLClone = imageGroupL ? imageGroupL.cloneNode(true) : null;

            // Клонируем ВСЕ параграфы
            const paragraphs = card.querySelectorAll('p');
            const paragraphClones = [];
            paragraphs.forEach(p => {
              paragraphClones.push(p.cloneNode(true));
            });

            // Собираем все элементы для модального окна в нужном порядке
            const contentToShow = [];
            if (titleClone) contentToShow.push(titleClone);
            if (imageGroupClone) contentToShow.push(imageGroupClone);
            if (imageGroupLClone) contentToShow.push(imageGroupLClone);
            paragraphClones.forEach(clone => contentToShow.push(clone));

            if (contentToShow.length === 0) return; // нечего показывать

            openModal(contentToShow);
          });
        });
      }
    });
  }
</script>
